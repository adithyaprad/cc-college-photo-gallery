<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Photo Gallery</title>
  <style>
    :root { --bg: #f6f6f4; --card: #fff; --text: #1d1d1f; --muted: #6e6e73; --accent: #2563eb; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #121214; --card: #1e1e22; --text: #f2f2f2; --muted: #9a9aa0; --accent: #60a5fa; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); }
    main { max-width: 960px; margin: 0 auto; padding: 24px 16px; }
    h1 { margin: 0 0 4px; font-size: 1.6rem; }
    p.sub { margin: 0 0 20px; color: var(--muted); }
    .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
    button { font: inherit; padding: 10px 16px; border-radius: 10px; border: 0; cursor: pointer;
             background: var(--accent); color: #fff; }
    button.secondary { background: var(--card); color: var(--text); border: 1px solid #8884; }
    button:disabled { opacity: .5; cursor: default; }
    #camera { display: none; background: var(--card); padding: 12px; border-radius: 12px; margin-bottom: 16px; }
    #camera video { width: 100%; max-height: 60vh; border-radius: 8px; background: #000; }
    #status { color: var(--muted); min-height: 1.4em; margin-bottom: 16px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; }
    .grid a { display: block; aspect-ratio: 1; overflow: hidden; border-radius: 10px; background: var(--card); }
    .grid img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .empty { color: var(--muted); }
  </style>
</head>
<body>
<main>
  <h1>Photo Gallery</h1>
  <p class="sub">Take or pick a photo. It is saved to a private S3 bucket.</p>

  <div class="actions">
    <button id="openCam">Take photo</button>
    <button id="pick" class="secondary">Upload a file</button>
    <input id="file" type="file" accept="image/*" hidden>
  </div>

  <div id="camera">
    <video id="video" autoplay playsinline></video>
    <div class="actions" style="margin: 10px 0 0">
      <button id="snap">Capture &amp; upload</button>
      <button id="closeCam" class="secondary">Cancel</button>
    </div>
  </div>

  <div id="status"></div>
  <div id="grid" class="grid"></div>
</main>

<script>
  const $ = (id) => document.getElementById(id);
  let stream = null;

  function setStatus(msg) { $("status").textContent = msg; }

  async function upload(blob, name) {
    setStatus("Uploading…");
    const form = new FormData();
    form.append("photo", blob, name);
    const res = await fetch("/api/upload", { method: "POST", body: form });
    if (!res.ok) { setStatus("Upload failed: " + (await res.text())); return; }
    setStatus("Uploaded.");
    loadGallery();
  }

  async function loadGallery() {
    const photos = await (await fetch("/api/photos")).json();
    $("grid").innerHTML = photos.length ? "" : '<p class="empty">No photos yet.</p>';
    for (const p of photos) {
      const a = document.createElement("a");
      a.href = p.url; a.target = "_blank";
      a.innerHTML = `<img loading="lazy" alt="" src="${p.url}">`;
      $("grid").appendChild(a);
    }
  }

  // Camera: live preview, then grab one frame as a JPEG.
  $("openCam").onclick = async () => {
    try {
      stream = await navigator.mediaDevices.getUserMedia({ video: true });
      $("video").srcObject = stream;
      $("camera").style.display = "block";
    } catch (e) {
      setStatus("Camera not available (" + e.name + "). Use 'Upload a file' instead.");
    }
  };
  function closeCam() {
    stream?.getTracks().forEach((t) => t.stop());
    stream = null;
    $("camera").style.display = "none";
  }
  $("closeCam").onclick = closeCam;
  $("snap").onclick = () => {
    const v = $("video"), c = document.createElement("canvas");
    c.width = v.videoWidth; c.height = v.videoHeight;
    c.getContext("2d").drawImage(v, 0, 0);
    c.toBlob((blob) => { closeCam(); upload(blob, "camera.jpg"); }, "image/jpeg", 0.9);
  };

  // File picker
  $("pick").onclick = () => $("file").click();
  $("file").onchange = (e) => {
    const f = e.target.files[0];
    if (f) upload(f, f.name);
    e.target.value = "";
  };

  loadGallery();
</script>
</body>
</html>
